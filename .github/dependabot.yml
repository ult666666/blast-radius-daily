# Review-first dependency version updates; no auto-merge is configured.
# devvit, @devvit/web and @devvit/start share one release train and must
# move together, so they get their own group.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      devvit:
        applies-to: "version-updates"
        patterns:
          - "devvit"
          - "@devvit/*"
      routine-npm:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 cannot be installed yet. Every typescript-eslint
      # release up to 8.72.1 declares the peer range
      # typescript ">=4.8.4 <6.1.0", so npm ci fails with ERESOLVE (#15).
      # Remove this entry once a typescript-eslint release accepts 7.x.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # Keep Node type definitions on the oldest supported runtime
      # (engines: node >=22.12.0), so code cannot type-check against
      # APIs that Node 22 lacks. Raise this with the engines minimum.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
