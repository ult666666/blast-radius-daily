# Review-first dependency version updates; no auto-merge is configured.
# devvit, @devvit/web and @devvit/start share one release train and must
# move together, so they get their own group.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      devvit:
        applies-to: "version-updates"
        patterns:
          - "devvit"
          - "@devvit/*"
      routine-npm:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
