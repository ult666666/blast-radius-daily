<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, user-scalable=no"
    />
    <meta name="theme-color" content="#06111d" />
    <link rel="stylesheet" href="splash.css" />
    <title>Blast Radius Daily</title>
  </head>
  <body>
    <main class="launch-card">
      <div class="noise" aria-hidden="true"></div>
      <header class="statusbar">
        <span class="status-dot"></span>
        <span>Daily incident</span>
        <span class="episode" id="episode">#—</span>
      </header>
      <section class="hero">
        <div class="mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <h1>Blast Radius Daily</h1>
        <p class="lede">
          A schema change is about to break your community’s data pipeline. Place up to two
          circuit breakers to save the most valuable dashboards, models and exports, then compare
          your score on today’s leaderboard.
        </p>
      </section>
      <footer>
        <div>
          <strong id="greeting">Today’s map</strong>
          <span>A new map every day at 00:00 UTC</span>
        </div>
        <button id="start-button" type="button">Play today’s incident <span aria-hidden="true">→</span></button>
      </footer>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
